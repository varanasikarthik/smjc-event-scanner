<!DOCTYPE html>
<html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SMJC Event Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 15px;

      background: #f2f4f7;

      font-family: Arial, sans-serif;
    }


    .container {

      max-width: 520px;

      margin: auto;

      background: white;

      padding: 20px;

      border-radius: 18px;

      box-shadow:
        0 6px 25px rgba(0,0,0,.15);
    }


    h1 {

      text-align: center;

      margin: 5px 0;

      color: #111827;

      font-size: 26px;
    }


    .subtitle {

      text-align: center;

      color: #6b7280;

      margin-bottom: 20px;

      font-weight: 700;
    }


    label {

      display: block;

      margin-top: 14px;

      margin-bottom: 6px;

      font-weight: 800;

      color: #374151;
    }


    select {

      width: 100%;

      padding: 13px;

      border-radius: 10px;

      border: 1px solid #d1d5db;

      font-size: 16px;

      background: white;
    }


    #reader {

      width: 100%;

      margin-top: 20px;

      border-radius: 12px;

      overflow: hidden;
    }


    button {

      width: 100%;

      padding: 14px;

      margin-top: 15px;

      border: none;

      border-radius: 10px;

      background: #111827;

      color: white;

      font-size: 16px;

      font-weight: 900;

      cursor: pointer;
    }


    button:disabled {

      background: #9ca3af;

      cursor: not-allowed;
    }


    .result {

      margin-top: 20px;

      padding: 18px;

      border-radius: 12px;

      text-align: center;

      font-weight: 900;

      display: none;

      line-height: 1.5;
    }


    .success {

      background: #dcfce7;

      color: #166534;
    }


    .error {

      background: #fee2e2;

      color: #991b1b;
    }


    .warning {

      background: #fef3c7;

      color: #92400e;
    }


    .student {

      margin-top: 12px;

      font-size: 14px;

      line-height: 1.8;

      text-align: left;

      background: rgba(255,255,255,.6);

      padding: 12px;

      border-radius: 10px;
    }


    .student strong {

      font-weight: 900;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    🎟️ SMJC EVENT SCANNER
  </h1>


  <div class="subtitle">
    Attendance Scanner
  </div>


  <label>
    Select Day
  </label>


  <select id="day">

    <option value="Day 1">
      Day 1 — 06 SEP
    </option>

    <option value="Day 2">
      Day 2 — 07 SEP
    </option>

    <option value="Day 3">
      Day 3 — 08 SEP
    </option>

  </select>


  <label>
    Select Activity
  </label>


  <select id="activity">
  </select>


  <div id="reader"></div>


  <button
    id="startButton"
    onclick="startScanner()"
  >
    📷 START SCANNER
  </button>


  <button
    id="stopButton"
    onclick="stopScanner()"
    disabled
  >
    ⛔ STOP SCANNER
  </button>


  <div
    id="result"
    class="result"
  ></div>


</div>



<script>


// ======================================================
// APPS SCRIPT URL
// ======================================================

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwztUUdFujNXHlumfDPOxmf5-yryNogtOxnIwuHEW1Lg_x1FrmWISlkBLn6ua0fUkfOog/exec";



// ======================================================
// ACTIVITIES
// ======================================================

const activities = {

  "Day 1": [

    "Main Gate Check-in",

    "Grand Luncheon",

    "Moonlight Dinner",

    "Main Gate Check-out"
  ],


  "Day 2": [

    "Main Gate Check-in",

    "Freshers Feast",

    "Starlit Dinner",

    "Main Gate Check-out"
  ],


  "Day 3": [

    "Main Gate Check-in",

    "Signature Lunch",

    "Twilight Dinner",

    "Main Gate Check-out"
  ]

};



// ======================================================
// SCANNER VARIABLES
// ======================================================

let scanner = null;

let scannerRunning = false;

let scanProcessing = false;



// ======================================================
// LOAD ACTIVITIES
// ======================================================

function loadActivities() {

  const day =
    document.getElementById("day").value;


  const activitySelect =
    document.getElementById("activity");


  activitySelect.innerHTML = "";


  activities[day].forEach(function(activity) {

    const option =
      document.createElement("option");


    option.value =
      activity;


    option.textContent =
      activity;


    activitySelect.appendChild(option);

  });

}



// ======================================================
// DAY CHANGE
// ======================================================

document
  .getElementById("day")
  .addEventListener(
    "change",
    loadActivities
  );


loadActivities();



// ======================================================
// START SCANNER
// ======================================================

function startScanner() {


  if (scannerRunning) {
    return;
  }


  scanProcessing = false;


  document
    .getElementById("result")
    .style.display = "none";


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },


    {

      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      }

    },


    function(decodedText) {

      if (scanProcessing) {
        return;
      }


      scanProcessing = true;


      processQRCode(decodedText);

    },


    function(errorMessage) {

      // Ignore continuous scanning errors

    }

  )


  .then(function() {

    scannerRunning = true;


    document
      .getElementById("startButton")
      .disabled = true;


    document
      .getElementById("stopButton")
      .disabled = false;

  })


  .catch(function(error) {

    scannerRunning = false;


    showResult(

      "❌ CAMERA ERROR<br><br>" +
      "Please allow camera permission.",

      "error"

    );

  });

}



// ======================================================
// STOP SCANNER
// ======================================================

function stopScanner() {


  if (!scanner || !scannerRunning) {

    return;

  }


  scanner.stop()

    .then(function() {

      scannerRunning = false;


      document
        .getElementById("startButton")
        .disabled = false;


      document
        .getElementById("stopButton")
        .disabled = true;

    })


    .catch(function() {

      scannerRunning = false;


      document
        .getElementById("startButton")
        .disabled = false;


      document
        .getElementById("stopButton")
        .disabled = true;

    });

}



// ======================================================
// PROCESS QR CODE
// ======================================================

function processQRCode(decodedText) {


  let ticketId = "";


  try {

    const url =
      new URL(decodedText);


    ticketId =
      url.searchParams.get("ticket") || "";

  }


  catch (error) {

    ticketId =
      decodedText.trim();

  }


  if (!ticketId) {

    scanProcessing = false;


    showResult(

      "❌ INVALID QR CODE",

      "error"

    );

    return;

  }


  const day =
    document.getElementById("day").value;


  const activity =
    document.getElementById("activity").value;


  showResult(

    "⏳ Checking ticket...",

    "warning"

  );


  stopScanner();


  sendAttendance(

    ticketId,

    day,

    activity

  );

}



// ======================================================
// SEND ATTENDANCE USING JSONP
// ======================================================

function sendAttendance(

  ticketId,

  day,

  activity

) {


  const callbackName =
    "scanCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement("script");


  const params = new URLSearchParams({

    action: "scan",

    ticketId: ticketId,

    day: day,

    activity: activity,

    callback: callbackName

  });


  window[callbackName] =
    function(data) {


      // Remove script

      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }


      // Remove callback

      try {

        delete window[callbackName];

      }

      catch (error) {

        window[callbackName] =
          undefined;

      }


      // Process response

      handleScanResponse(

        data,

        ticketId,

        day,

        activity

      );

    };


  script.src =
    APPS_SCRIPT_URL +
    "?" +
    params.toString();


  script.onerror =
    function() {


      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }


      try {

        delete window[callbackName];

      }

      catch (error) {

        window[callbackName] =
          undefined;

      }


      scanProcessing = false;


      showResult(

        "❌ CONNECTION ERROR<br><br>" +
        "Please check your internet connection.",

        "error"

      );

    };


  document
    .body
    .appendChild(script);

}



// ======================================================
// HANDLE SCAN RESPONSE
// ======================================================

function handleScanResponse(

  data,

  ticketId,

  day,

  activity

) {


  if (!data) {

    scanProcessing = false;


    showResult(

      "❌ NO RESPONSE FROM SERVER",

      "error"

    );

    return;

  }


  // ====================================================
  // SUCCESS
  // ====================================================

  if (data.success) {


    showResult(

      "✅ ALLOWED" +

      '<div class="student">' +

      "<strong>👤 Student:</strong> " +
      escapeHTML(
        data.studentName || ""
      ) +

      "<br>" +

      "<strong>🎫 Ticket:</strong> " +
      escapeHTML(
        data.ticketId || ticketId
      ) +

      "<br>" +

      "<strong>🪪 Reg No:</strong> " +
      escapeHTML(
        data.regNo || ""
      ) +

      "<br>" +

      "<strong>📚 Year / Group:</strong> " +
      escapeHTML(
        data.yearGroup || ""
      ) +

      "<br>" +

      "<strong>📅 Day:</strong> " +
      escapeHTML(
        data.day || day
      ) +

      "<br>" +

      "<strong>🎯 Activity:</strong> " +
      escapeHTML(
        data.activity || activity
      ) +

      "<br>" +

      "<strong>🕘 Time:</strong> " +
      escapeHTML(
        data.time || ""
      ) +

      "</div>",

      "success"

    );


    scanProcessing = false;


    return;

  }



  // ====================================================
  // ERROR
  // ====================================================

  let message =
    data.message ||
    "Scan failed.";


  if (
    message ===
    "ALREADY COMPLETED"
  ) {

    showResult(

      "⚠️ ALREADY COMPLETED" +

      '<div class="student">' +

      "<strong>👤 Student:</strong> " +
      escapeHTML(
        data.studentName || ""
      ) +

      "<br>" +

      "<strong>🎫 Ticket:</strong> " +
      escapeHTML(
        data.ticketId || ticketId
      ) +

      "<br>" +

      "<strong>🪪 Reg No:</strong> " +
      escapeHTML(
        data.regNo || ""
      ) +

      "<br>" +

      "<strong>📅 Day:</strong> " +
      escapeHTML(
        data.day || day
      ) +

      "<br>" +

      "<strong>🎯 Activity:</strong> " +
      escapeHTML(
        data.activity || activity
      ) +

      "</div>",

      "warning"

    );

  }


  else if (
    message ===
    "INVALID TICKET"
  ) {

    showResult(

      "❌ INVALID TICKET",

      "error"

    );

  }


  else if (
    message ===
    "MAIN GATE CHECK-IN NOT FOUND"
  ) {

    showResult(

      "❌ CHECK-IN NOT FOUND" +

      '<div class="student">' +

      "Student must complete " +
      "<strong>Main Gate Check-in</strong> " +
      "before Check-out." +

      "</div>",

      "error"

    );

  }


  else {

    showResult(

      "❌ " +
      escapeHTML(message),

      "error"

    );

  }


  scanProcessing = false;

}



// ======================================================
// ESCAPE HTML
// ======================================================

function escapeHTML(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



// ======================================================
// SHOW RESULT
// ======================================================

function showResult(

  message,

  type

) {


  const result =
    document.getElementById("result");


  result.style.display =
    "block";


  result.className =
    "result " + type;


  result.innerHTML =
    message;

}


</script>


</body>

</html>
